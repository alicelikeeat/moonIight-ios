name: Local 3D validation
on:
  push:
    branches: [codex/local-3d-v166]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test mesh, persistence, quality rules and USDZ serialization
        run: |
          mkdir -p build/local3d
          swiftc -swift-version 6 Features/Local3D/Domain/*.swift Shared/Persistence/VersionedJSONFile.swift tests/local3d/main.swift -o build/local3d/tests
          build/local3d/tests build/local3d/fixture.usdz
          python3 scripts/validate_local3d.py build/local3d/fixture.usdz
      - name: Compile base iOS 16 application for simulator
        run: |
          set -o pipefail
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/local3d/xcodebuild.log
      - name: Test RealityKit load and asset roundtrip on simulator
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(x["udid"] for group in json.load(sys.stdin)["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -only-testing:Local3DIntegrationTests CODE_SIGNING_ALLOWED=NO -resultBundlePath build/local3d/Integration.xcresult test 2>&1 | tee build/local3d/integration.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Local3D-validation
          path: build/local3d
