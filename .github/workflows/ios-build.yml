name: iOS build
on:
  push:
    # The cursor branch is included so the hold fix can be verified before it
    # is merged. Version tags are the only publishes: v1.43 builds the IPA.
    branches: [main, cursor/fix-tab-hold-card-overlap-3131]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ui_suite:
        description: 'UI validation scope (all on pull requests)'
        type: choice
        default: all
        options: [all, rpg, landlord, directed, treasure, preview, settings, scroll, none]
      device_ipa:
        description: 'Also archive a device IPA and attach it to this run (no GitHub Release)'
        type: boolean
        default: false
      ipa_version:
        description: 'Version for the device IPA, e.g. 1.52 (build number = digits)'
        type: string
        default: ''
      publish_release:
        description: 'With device_ipa: create tag vX.Y at this commit and publish the IPA as a release'
        type: boolean
        default: false
      release_type:
        description: 'With publish_release: pre-release (device test) or the latest official release'
        type: choice
        default: prerelease
        options: [prerelease, latest]
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.ui_suite || 'all' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: write
jobs:
  build:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'docs-release-notes:')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set build version
        id: version
        shell: bash
        env:
          DEVICE_IPA: ${{ inputs.device_ipa }}
          IPA_VERSION: ${{ inputs.ipa_version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          # A version tag is the public release (v1.43 -> marketing 1.43, build 143).
          # Other pushes only exercise the simulator and do not publish an IPA.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MARKETING="${GITHUB_REF#refs/tags/v}"
            BUILD="$(printf '%s' "$MARKETING" | tr -d '.')"
            echo "marketing=${MARKETING}" >> "$GITHUB_OUTPUT"
            echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "device=true" >> "$GITHUB_OUTPUT"
          elif [[ "${DEVICE_IPA}" == "true" && "${IPA_VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
            # Manual device test build: same archive as a release, attached
            # to the run as an artifact; nothing is published.
            echo "marketing=${IPA_VERSION}" >> "$GITHUB_OUTPUT"
            echo "build=$(printf '%s' "$IPA_VERSION" | tr -d '.')" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "device=true" >> "$GITHUB_OUTPUT"
            echo "publish=${PUBLISH_RELEASE}" >> "$GITHUB_OUTPUT"
          else
            BASELINE_RUN=100
            MINOR=$((GITHUB_RUN_NUMBER - BASELINE_RUN))
            if [[ "$MINOR" -lt 1 ]]; then MINOR=1; fi
            echo "marketing=1.${MINOR}" >> "$GITHUB_OUTPUT"
            echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "device=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test treasure interaction policy
        run: |
          mkdir -p build
          swiftc LandlordRules.swift CardMediaPolicy.swift TreasureRules.swift TreasureVideoSelectionModel.swift AppSearchIntent.swift tests/main.swift -o build/treasure-tests
          build/treasure-tests
      - name: Test RPG pure domain
        run: |
          mkdir -p build
          swiftc Features/RPG/Media/RPGGIFTiming.swift Features/RPG/Domain/World/RPGGlassLab.swift Features/RPG/Domain/World/RPGMapEditor.swift Features/RPG/Domain/World/RPGGlassWorld.swift Features/RPG/Domain/Blocks/RPGEditDraft.swift Shared/Localization/L10n.swift Features/GlassShapeEditor/Domain/GlassShapeGeometry.swift Features/GlassShapeEditor/Domain/GlassShapeDocument.swift Features/Glass3D/Domain/SpatialModel.swift Features/Glass3D/Domain/SpatialMotion.swift Features/Glass3D/Domain/SpatialPhysics.swift Features/Glass3D/Domain/SpatialBuilding.swift Features/Glass3D/Domain/SpatialEcology.swift Features/Glass3D/Domain/SpatialGenerator.swift Features/Glass3D/Domain/SpatialNativeGlass.swift Features/Glass3D/Domain/SpatialProjection.swift Features/Glass3D/Domain/SpatialSkills.swift Features/Glass3D/Domain/SpatialBattle.swift Features/Glass3D/Domain/SpatialGamepad.swift Features/Glass3D/Domain/SpatialAssetLibrary.swift Features/Generate3D/Domain/Generate3DCore.swift Features/Generate3D/Domain/Generate3DRig.swift Features/Generate3D/Domain/Generate3DRender.swift Features/Generate3D/Domain/Generate3DClaude.swift Features/Generate3D/Domain/ProceduralCharacter.swift Features/Generate3D/Domain/MultiViewCarver.swift Features/Generate3D/Domain/VertexColorBaker.swift Features/Generate3D/Domain/TripoSRDecoder.swift Features/Generate3D/Domain/Image3DServerProtocol.swift Features/Rigging/Domain/RiggedCharacter.swift Features/Rigging/Engine/MeshAnalyzer.swift Features/Rigging/Engine/JointEstimator.swift Features/Rigging/Engine/SkeletonBuilder.swift Features/Rigging/Engine/SkinWeightSolver.swift Features/Rigging/Engine/MotionValidator.swift Features/Rigging/Engine/GLBCodec.swift Features/Rigging/Services/RiggingPipeline.swift Features/Rigging/Services/CloudRiggingProtocol.swift Features/Rigging/Services/RiggingAssetStore.swift Features/RPG/Domain/World/RPGWorldRoute.swift Features/RPG/Domain/World/RPGFrameMetrics.swift Features/RPG/Domain/Blocks/RPGBehaviorRules.swift Features/RPG/Domain/Story/RPGStoryAuthoring.swift Features/RPG/Domain/Story/RPGStoryGraph.swift Features/RPG/Domain/Story/RPGOfficialStory.swift Features/RPG/Domain/Story/RPGStoryRuntime.swift Features/RPG/Domain/Combat/RPGCombatRules.swift Features/RPG/Media/RPGMediaPolicy.swift Features/RPG/Domain/World/RPGProjectionRules.swift Features/RPG/Domain/Blocks/RPGWorldEditing.swift Features/RPG/Persistence/RPGWorldDiskStore.swift Features/RPG/Domain/World/RPGWorldGenerator.swift Features/RPG/Domain/World/WorldState.swift Features/RPG/Domain/World/WorldProjection.swift Features/RPG/Persistence/RPGWorldCodec.swift Tests/RPG/main.swift -o build/rpg-tests
          build/rpg-tests
      - name: Test versioned file persistence
        run: |
          mkdir -p build
          swiftc -swift-version 6 Shared/Persistence/VersionedJSONFile.swift tests/persistence/main.swift -o build/persistence-tests
          build/persistence-tests
      - name: Test GIF decoding
        run: |
          mkdir -p build
          swiftc Features/RPG/Media/RPGGIFTiming.swift Features/RPG/Media/RPGGIFLibrary.swift tests/gif/main.swift -o build/gif-tests
          build/gif-tests
      - name: Test media import index
        run: |
          mkdir -p build
          swiftc Shared/Persistence/MediaImportIndex.swift tests/import/main.swift -o build/import-tests
          build/import-tests
      - name: Verify control inventory
        run: |
          python3 scripts/audit_controls.py
          git diff --exit-code -- docs/CONTROL_INVENTORY.md
      - name: Fetch on-device depth model weights
        run: |
          # Depth Anything V2 Small, Apple's Core ML conversion (Apache-2.0), pinned revision + SHA-256.
          set -euo pipefail
          DIR="Resources/DepthModel/DepthAnythingV2SmallF16.mlpackage/Data/com.apple.CoreML/weights"
          mkdir -p "$DIR"
          URL="https://huggingface.co/apple/coreml-depth-anything-v2-small/resolve/cfef6f6f2a70783dedc0bfae40cecbc2052285d3/DepthAnythingV2SmallF16.mlpackage/Data/com.apple.CoreML/weights/weight.bin"
          for attempt in 1 2 3; do curl -fsSL --retry 3 -o "$DIR/weight.bin" "$URL" && break || sleep 5; done
          echo "fa60d9b6a155734f59029ebb882fd54e549bfaee3539c1a9cbd2cbbab64a0fed  $DIR/weight.bin" | shasum -a 256 -c -
          echo "44ac97a3efcfd52113183fb2862ff59cd0368e9ec2e30a90a54980dd11407042  Resources/DepthModel/DepthAnythingV2SmallF16.mlpackage/Data/com.apple.CoreML/model.mlmodel" | shasum -a 256 -c -
      - name: Compile simulator build
        if: steps.version.outputs.release != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO build
      - name: Check public discovery source APIs
        run: |
          mkdir -p build
          python3 scripts/check_sources.py
          cat build/source-check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Boot iOS simulator
        id: simulator
        # ui_suite=none: compile and pure checks only, no simulator or UI tests.
        if: steps.version.outputs.release != 'true' && inputs.ui_suite != 'none'
        timeout-minutes: 10
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          # xcodebuild's first launch can sit for many minutes when the
          # simulator service hub is not ready yet. Boot it here so that
          # wait is not charged against the gesture-suite deadline.
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Run RPG stage validation
        if: steps.version.outputs.release != 'true' && (inputs.ui_suite == '' || inputs.ui_suite == 'all' || inputs.ui_suite == 'rpg')
        timeout-minutes: 35
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -only-testing:MoonlightUITests/ScrollGestureTests/testRPGUnindexedRecoveryPreservesConstructionAndRewardReceipt -only-testing:MoonlightUITests/ScrollGestureTests/testRPGSearchOpensStoryEditorAndDiagnosticsDirectly -only-testing:MoonlightUITests/ScrollGestureTests/testRPGSideCombatAndDiagnostics -only-testing:MoonlightUITests/ScrollGestureTests/testRPGAuthoredCutsceneProducesFramesAndResumesMuted -only-testing:MoonlightUITests/ScrollGestureTests/testRPGStoryEditorCanPreviewAndPublishBranch -only-testing:MoonlightUITests/ScrollGestureTests/testRPGStoryChoicePersistsAndWaitsForRealWorldEvent -only-testing:MoonlightUITests/ScrollGestureTests/testRPGCombatRewardsPersistWithoutDuplicateDrop -only-testing:MoonlightUITests/ScrollGestureTests/testRPGSkeletonCanValidateExitAndPreserveOtherModules -only-testing:MoonlightUITests/ScrollGestureTests/testRPGWorldSeedChunksAndMovement -only-testing:MoonlightUITests/ScrollGestureTests/testRPGBuildUndoSaveAndReopen -only-testing:MoonlightUITests/ScrollGestureTests/testRPGSharedEntityAndSafeDualProjection -only-testing:MoonlightUITests/ScrollGestureTests/testRPGMediaFramesBudgetLoopAndBackground -only-testing:MoonlightUITests/ScrollGestureTests/testRPGCellContentEditorGlassAndReopen -only-testing:MoonlightUITests/ScrollGestureTests/testSandboxLaunchControlCenterAndPortraitPages -only-testing:MoonlightUITests/ScrollGestureTests/testSandboxLoadFailureOffersNewWorld -only-testing:MoonlightUITests/ScrollGestureTests/testRPGGlassLabModesAndSample -resultBundlePath build/RPGTests.xcresult test
      - name: Run V2.4.1 landlord tests
        if: steps.version.outputs.release != 'true' && (inputs.ui_suite == '' || inputs.ui_suite == 'all' || inputs.ui_suite == 'landlord')
        timeout-minutes: 15
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -only-testing:MoonlightUITests/ScrollGestureTests/testLandlordClassicWholeGameAndNewRound -only-testing:MoonlightUITests/ScrollGestureTests/testLandlordMediaBudgetFocusBackgroundAndModeCleanup -resultBundlePath build/V241Tests.xcresult test
      - name: Run V2.3 wall playback and search tests
        if: steps.version.outputs.release != 'true' && (inputs.ui_suite == '' || inputs.ui_suite == 'all' || inputs.ui_suite == 'directed')
        timeout-minutes: 15
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO -only-testing:MoonlightUITests/ScrollGestureTests/testVideoWallSelectionLimitModesFocusAndCleanup -only-testing:MoonlightUITests/ScrollGestureTests/testAssistantSearchRoutesTreasureAndTypedMediaWithoutAI -resultBundlePath build/V23Tests.xcresult test
      - name: Run treasure browsing regression
        if: ${{ !cancelled() && steps.version.outputs.release != 'true' && steps.simulator.outcome == 'success' && (inputs.ui_suite == '' || inputs.ui_suite == 'all' || inputs.ui_suite == 'treasure' || inputs.ui_suite == 'preview') }}
        timeout-minutes: 15
        shell: bash
        env:
          UI_SUITE: ${{ inputs.ui_suite }}
        run: |
          TESTS=(testTreasureGridCanOpenHoldAndSwitchTwentyTimes testTreasureDragKeepsTouchAndPhysicsOwnership testTreasureVideoPreviewCanPlayFreezeAndRememberPreference)
          if [[ "$UI_SUITE" == preview ]]; then TESTS=(testTreasureVideoPreviewCanPlayFreezeAndRememberPreference); fi
          ONLY=()
          for TEST_NAME in "${TESTS[@]}"; do ONLY+=("-only-testing:MoonlightUITests/ScrollGestureTests/$TEST_NAME"); done
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO "${ONLY[@]}" -resultBundlePath build/TreasureTests.xcresult test
      - name: Run configuration UI regression
        if: ${{ !cancelled() && steps.version.outputs.release != 'true' && steps.simulator.outcome == 'success' && (inputs.ui_suite == '' || inputs.ui_suite == 'all' || inputs.ui_suite == 'settings') }}
        timeout-minutes: 20
        shell: bash
        run: |
          SIMULATOR_ID="${{ steps.simulator.outputs.id }}"
          COMMON=(-project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO)
          ONLY=()
          for TEST_NAME in testBackgroundImagesVideosAndEditorKeepCardScrolling testButtonBackgroundPlaylistPersists testConfiguredMenuPersistsAndShowsExtraActionInMore testContextLibraryNavigationCanPlayAndReturn; do
            ONLY+=("-only-testing:MoonlightUITests/ScrollGestureTests/${TEST_NAME}")
          done
          # Keep configuration cases separate so scrolling still runs after a
          # failure. Every suite remains blocking for the final job result.
          xcodebuild "${COMMON[@]}" -resultBundlePath build/SettingsTests.xcresult "${ONLY[@]}" test
      - name: Run card scrolling UI tests
        if: ${{ !cancelled() && steps.version.outputs.release != 'true' && steps.simulator.outcome == 'success' && (inputs.ui_suite == '' || inputs.ui_suite == 'all' || inputs.ui_suite == 'scroll') }}
        timeout-minutes: 35
        shell: bash
        run: |
          SIMULATOR_ID="${{ steps.simulator.outputs.id }}"
          COMMON=(-project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO)
          SKIP=("-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGUnindexedRecoveryPreservesConstructionAndRewardReceipt" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGSearchOpensStoryEditorAndDiagnosticsDirectly" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGSideCombatAndDiagnostics" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGAuthoredCutsceneProducesFramesAndResumesMuted" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGStoryEditorCanPreviewAndPublishBranch" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGStoryChoicePersistsAndWaitsForRealWorldEvent" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGCombatRewardsPersistWithoutDuplicateDrop" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGMediaFramesBudgetLoopAndBackground" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGSharedEntityAndSafeDualProjection" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGBuildUndoSaveAndReopen" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGSkeletonCanValidateExitAndPreserveOtherModules" "-skip-testing:MoonlightUITests/ScrollGestureTests/testRPGWorldSeedChunksAndMovement")
          for TEST_NAME in testLandlordClassicWholeGameAndNewRound testLandlordMediaBudgetFocusBackgroundAndModeCleanup testBackgroundImagesVideosAndEditorKeepCardScrolling testButtonBackgroundPlaylistPersists testConfiguredMenuPersistsAndShowsExtraActionInMore testContextLibraryNavigationCanPlayAndReturn testTreasureGridCanOpenHoldAndSwitchTwentyTimes testTreasureDragKeepsTouchAndPhysicsOwnership testTreasureVideoPreviewCanPlayFreezeAndRememberPreference testVideoWallSelectionLimitModesFocusAndCleanup testAssistantSearchRoutesTreasureAndTypedMediaWithoutAI; do
            SKIP+=("-skip-testing:MoonlightUITests/ScrollGestureTests/${TEST_NAME}")
          done
          xcodebuild "${COMMON[@]}" -resultBundlePath build/ScrollGestureTests.xcresult "${SKIP[@]}" test
      - name: Export UI review screenshots
        if: always() && steps.version.outputs.release != 'true'
        shell: bash
        run: |
          for RESULT in build/RPGTests.xcresult build/V241Tests.xcresult build/V23Tests.xcresult build/TreasureTests.xcresult build/SettingsTests*.xcresult build/ScrollGestureTests.xcresult; do
            if [[ -f "$RESULT/Info.plist" ]]; then
              xcrun xcresulttool export attachments --path "$RESULT" --output-path "build/ui-attachments/$(basename "$RESULT" .xcresult)"
            fi
          done
          python3 scripts/export_review_images.py
      - name: Upload UI review screenshots
        if: always() && steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UI-Review-v${{ steps.version.outputs.marketing }}
          path: build/ui-review
          if-no-files-found: ignore
      - name: Upload gesture test results
        if: always() && steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScrollGestureTests-v${{ steps.version.outputs.marketing }}
          path: |
            build/RPGTests.xcresult
            build/V241Tests.xcresult
            build/V23Tests.xcresult
            build/TreasureTests.xcresult
            build/SettingsTests*.xcresult
            build/ScrollGestureTests.xcresult
          if-no-files-found: ignore
      - name: Import Ad Hoc signing
        id: signing
        if: steps.version.outputs.device == 'true'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$PROFILE_BASE64" || -z "$KEYCHAIN_PASSWORD" || -z "$TEAM_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets were supplied; creating simulator output and an unsigned device IPA."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/moonlight.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
      - name: Archive and export IPA
        if: steps.version.outputs.device == 'true' && steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Release -destination 'generic/platform=iOS' -archivePath build/Moonlight.xcarchive MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>com.moonlight.feed</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Moonlight.xcarchive -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist
          IPA_PATH=$(find build/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          mv "$IPA_PATH" "build/ipa/Moonlight-v${APP_VERSION}.ipa"
      - name: Archive and package unsigned iOS IPA
        if: steps.version.outputs.device == 'true' && steps.signing.outputs.ready != 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Release -destination 'generic/platform=iOS' -archivePath build/Moonlight-Unsigned.xcarchive MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p build/unsigned-ipa/Payload
          cp -R build/Moonlight-Unsigned.xcarchive/Products/Applications/Moonlight.app build/unsigned-ipa/Payload/Moonlight.app
          (cd build/unsigned-ipa && /usr/bin/zip -qry "Moonlight-v${APP_VERSION}.ipa" Payload)
      - name: Validate device archive metadata
        if: steps.version.outputs.device == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          SIGNED_READY: ${{ steps.signing.outputs.ready }}
        run: |
          python3 - <<'PYTHON'
          import os, plistlib
          from pathlib import Path
          archive = 'Moonlight.xcarchive' if os.environ['SIGNED_READY'] == 'true' else 'Moonlight-Unsigned.xcarchive'
          app = Path('build') / archive / 'Products/Applications/Moonlight.app'
          with (app / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          assert info.get('CFBundleShortVersionString') == os.environ['APP_VERSION'], 'Missing or wrong application version'
          assert info.get('CFBundleVersion') == os.environ['BUILD_NUMBER'], 'Wrong build number'
          assert info.get('CFBundleSupportedPlatforms') == ['iPhoneOS'], 'Expected device archive'
          assert (app / info['CFBundleExecutable']).is_file(), 'Missing application executable'
          print('Device archive metadata verified:', info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PYTHON
      - name: Upload unsigned IPA
        if: steps.version.outputs.device == 'true' && steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-Unsigned-IPA-v${{ steps.version.outputs.marketing }}
          path: build/unsigned-ipa/Moonlight-v${{ steps.version.outputs.marketing }}.ipa
          if-no-files-found: error
      - name: Upload signed IPA
        if: steps.version.outputs.device == 'true' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-IPA-v${{ steps.version.outputs.marketing }}
          path: build/ipa/Moonlight-v${{ steps.version.outputs.marketing }}.ipa
          if-no-files-found: error
      - name: Publish versioned IPA download
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          SIGNED_READY: ${{ steps.signing.outputs.ready }}
        shell: bash
        run: |
          TAG_COMMIT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "The version tag moved during this build; refusing to publish a different snapshot."
            exit 1
          fi
          if [[ "$SIGNED_READY" == "true" ]]; then
            IPA_PATH="build/ipa/Moonlight-v${APP_VERSION}.ipa"
            RELEASE_NOTE="本版本为已签名 IPA。构建与验证记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            IPA_PATH="build/unsigned-ipa/Moonlight-v${APP_VERSION}.ipa"
            RELEASE_NOTE="本版本为未签名 IPA，请在手机端签名后安装。构建与验证记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          NOTES_PATH="build/release-notes.md"
          cat .github/RELEASE_NOTES.md > "$NOTES_PATH"
          printf '\n验证：GitHub Actions 设备架构归档与数量/交互策略检查通过；模拟器和 UI 回归状态请查对应 PR 记录，真机验证尚未执行。\n\n%s\n' "$RELEASE_NOTE" >> "$NOTES_PATH"
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" "$IPA_PATH" --clobber
            gh release edit "v${APP_VERSION}" --title "月淡 v${APP_VERSION}" --notes-file "$NOTES_PATH"
          else
            gh release create "v${APP_VERSION}" "$IPA_PATH" --target "$GITHUB_SHA" --title "月淡 v${APP_VERSION}" --notes-file "$NOTES_PATH"
          fi
      - name: Publish manual device build as a release
        # The workflow token creates the tag and release, so this works where
        # pushing a tag is not possible. It never replaces an existing release.
        if: steps.version.outputs.release != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          SIGNED_READY: ${{ steps.signing.outputs.ready }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1 || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; refusing to replace it."
            exit 1
          fi
          if [[ "$SIGNED_READY" == "true" ]]; then
            IPA_PATH="build/ipa/Moonlight-v${APP_VERSION}.ipa"; SIGNING="已签名（Ad Hoc）"
          else
            IPA_PATH="build/unsigned-ipa/Moonlight-v${APP_VERSION}.ipa"; SIGNING="未签名，无嵌入描述文件，需要自行重签后安装"
          fi
          DIGEST=$(shasum -a 256 "$IPA_PATH" | cut -d' ' -f1)
          NOTES_PATH="build/release-notes.md"
          cat .github/RELEASE_NOTES.md > "$NOTES_PATH"
          {
            printf '\n验证：本版为手动真机测试构建。GitHub Actions 设备架构归档与元数据校验通过；完整界面回归以分支 %s 的对应运行为准；真机验证尚未执行，自动化通过不等于真机通过。\n\n' "$GITHUB_REF_NAME"
            printf -- '- 构建记录：%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- 源码快照：`%s`（分支 `%s`）\n' "$GITHUB_SHA" "$GITHUB_REF_NAME"
            printf -- '- 安装包：`Moonlight-v%s.ipa`，版本 %s / 构建 %s，iPhoneOS arm64，最低 iOS 16.0。\n' "$APP_VERSION" "$APP_VERSION" "${{ steps.version.outputs.build }}"
            printf -- '- 签名：%s。\n' "$SIGNING"
            printf -- '- SHA-256：`%s`\n' "$DIGEST"
          } >> "$NOTES_PATH"
          if [[ "$RELEASE_TYPE" == "latest" ]]; then
            gh release create "$TAG" "$IPA_PATH" --target "$GITHUB_SHA" --title "月淡 v${APP_VERSION}" --notes-file "$NOTES_PATH" --latest
          else
            gh release create "$TAG" "$IPA_PATH" --target "$GITHUB_SHA" --title "月淡 v${APP_VERSION} · 真机测试版" --notes-file "$NOTES_PATH" --prerelease
          fi
      - name: Upload simulator app when signing is absent
        if: steps.version.outputs.release != 'true' && steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Moonlight.app
          if-no-files-found: error
      - name: Delete temporary keychain
        if: always() && steps.signing.outputs.keychain_path != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain_path }}"
  update-release-notes:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'docs-release-notes:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing version description without rebuilding IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=$(tr -d '\r\n' < .github/RELEASE_UPDATE_TAG)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file .github/RELEASE_UPDATE.md



