name: iOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'docs-release-notes:')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set build version
        id: version
        shell: bash
        run: |
          echo "marketing=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Compile simulator build
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData INFOPLIST_KEY_CFBundleShortVersionString="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO build
      - name: Check public discovery source APIs
        run: |
          python3 scripts/check_sources.py
          cat build/source-check.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run card scrolling UI tests
        timeout-minutes: 35
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          COMMON=(-project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build/DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO)
          FOCUS=(testBackgroundImagesVideosAndEditorKeepCardScrolling testButtonBackgroundPlaylistPersists testConfiguredMenuPersistsAndShowsExtraActionInMore testContextLibraryNavigationCanPlayAndReturn)
          ONLY=()
          SKIP=()
          for TEST_NAME in "${FOCUS[@]}"; do
            ONLY+=("-only-testing:MoonlightUITests/ScrollGestureTests/${TEST_NAME}")
            SKIP+=("-skip-testing:MoonlightUITests/ScrollGestureTests/${TEST_NAME}")
          done
          # Each focused gesture suite used to run twice before the remaining
          # suite.  One successful pass is the release gate; duplicating it
          # wastes runner minutes and can turn a stable pass into a flaky retry.
          xcodebuild "${COMMON[@]}" -resultBundlePath build/SettingsTests.xcresult "${ONLY[@]}" test
          xcodebuild "${COMMON[@]}" -resultBundlePath build/ScrollGestureTests.xcresult "${SKIP[@]}" test
      - name: Export UI review screenshots
        if: always()
        shell: bash
        run: |
          for RESULT in build/SettingsTests*.xcresult build/ScrollGestureTests.xcresult; do
            if [[ -f "$RESULT/Info.plist" ]]; then
              xcrun xcresulttool export attachments --path "$RESULT" --output-path "build/ui-attachments/$(basename "$RESULT" .xcresult)"
            fi
          done
          python3 scripts/export_review_images.py
      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Review-v${{ steps.version.outputs.marketing }}
          path: build/ui-review
          if-no-files-found: ignore
      - name: Upload gesture test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScrollGestureTests-v${{ steps.version.outputs.marketing }}
          path: |
            build/SettingsTests*.xcresult
            build/ScrollGestureTests.xcresult
          if-no-files-found: ignore
      - name: Import Ad Hoc signing
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$PROFILE_BASE64" || -z "$KEYCHAIN_PASSWORD" || -z "$TEAM_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets were supplied; creating simulator output and an unsigned device IPA."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/moonlight.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
      - name: Archive and export IPA
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Release -destination 'generic/platform=iOS' -archivePath build/Moonlight.xcarchive INFOPLIST_KEY_CFBundleShortVersionString="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>com.moonlight.feed</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Moonlight.xcarchive -exportPath build/ipa -exportOptionsPlist build/ExportOptions.plist
          IPA_PATH=$(find build/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          mv "$IPA_PATH" "build/ipa/Moonlight-v${APP_VERSION}.ipa"
      - name: Archive and package unsigned iOS IPA
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild -project Moonlight-iOS.xcodeproj -scheme Moonlight -configuration Release -destination 'generic/platform=iOS' -archivePath build/Moonlight-Unsigned.xcarchive INFOPLIST_KEY_CFBundleShortVersionString="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p build/unsigned-ipa/Payload
          cp -R build/Moonlight-Unsigned.xcarchive/Products/Applications/Moonlight.app build/unsigned-ipa/Payload/Moonlight.app
          (cd build/unsigned-ipa && /usr/bin/zip -qry "Moonlight-v${APP_VERSION}.ipa" Payload)
      - name: Upload unsigned IPA
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-Unsigned-IPA-v${{ steps.version.outputs.marketing }}
          path: build/unsigned-ipa/Moonlight-v${{ steps.version.outputs.marketing }}.ipa
          if-no-files-found: error
      - name: Upload signed IPA
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-IPA-v${{ steps.version.outputs.marketing }}
          path: build/ipa/Moonlight-v${{ steps.version.outputs.marketing }}.ipa
          if-no-files-found: error
      - name: Publish versioned IPA download
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          SIGNED_READY: ${{ steps.signing.outputs.ready }}
        shell: bash
        run: |
          CURRENT_MAIN=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ "$CURRENT_MAIN" != "$GITHUB_SHA" ]]; then
            echo "A newer commit superseded this build; keeping its artifacts without replacing the release."
            exit 0
          fi
          if [[ "$SIGNED_READY" == "true" ]]; then
            IPA_PATH="build/ipa/Moonlight-v${APP_VERSION}.ipa"
            RELEASE_NOTE="本版本为已签名 IPA。构建与验证记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            IPA_PATH="build/unsigned-ipa/Moonlight-v${APP_VERSION}.ipa"
            RELEASE_NOTE="本版本为未签名 IPA，请在手机端签名后安装。构建与验证记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          NOTES_PATH="build/release-notes.md"
          cat .github/RELEASE_NOTES.md > "$NOTES_PATH"
          printf '\n验证：模拟器构建、界面回归测试及公开内容源接口检查通过。\n\n%s\n' "$RELEASE_NOTE" >> "$NOTES_PATH"
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" "$IPA_PATH" --clobber
            gh release edit "v${APP_VERSION}" --title "月淡 v${APP_VERSION}" --notes-file "$NOTES_PATH"
          else
            gh release create "v${APP_VERSION}" "$IPA_PATH" --target "$GITHUB_SHA" --title "月淡 v${APP_VERSION}" --notes-file "$NOTES_PATH"
          fi
      - name: Upload simulator app when signing is absent
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/Moonlight.app
          if-no-files-found: error
      - name: Delete temporary keychain
        if: always() && steps.signing.outputs.keychain_path != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain_path }}"
  update-release-notes:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'docs-release-notes:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing version description without rebuilding IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=$(tr -d '\r\n' < .github/RELEASE_UPDATE_TAG)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file .github/RELEASE_UPDATE.md


